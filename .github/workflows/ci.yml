name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Forge (core + hub + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hub,dev]"
      - name: Run core tests
        run: pytest tests/ -v
      - name: Run Hub tests
        run: pytest hub/tests/ -v
      - name: Validate shell scripts
        run: sh -n install.sh
      - name: Validate Docker Compose (default + remote profile)
        run: |
          cp deploy/remote/.env.example deploy/remote/.env
          cp deploy/remote/Caddyfile.example deploy/remote/Caddyfile
          docker compose -f hub/docker-compose.yml config >/dev/null
          docker compose -f hub/docker-compose.yml --profile remote config >/dev/null
