<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Preview</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='4' y='4' width='120' height='120' rx='28' fill='%2316181D'/%3E%3Cpolygon points='64,68 31,49 31,87 64,106' fill='%234E5666'/%3E%3Cpolygon points='64,68 97,49 97,87 64,106' fill='%23F2F3F5'/%3E%3Cpolygon points='64,23 97,42 64,61 31,42' fill='%23E8A838'/%3E%3C/svg%3E">
<style>
  :root { --bg: #1b1d21; --panel: #26292f; --text: #e6e6e6; --muted: #9aa0a6; --accent: #e8a838; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }
  header { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px;
    align-items: center; flex-wrap: wrap; pointer-events: none; }
  header > * { pointer-events: auto; }
  .card { background: var(--panel); border-radius: 8px; padding: 8px 12px; }
  select, input, button { font: inherit; color: var(--text); background: #33373e;
    border: 1px solid #444a52; border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; }
  #info { color: var(--muted); }
  #info b { color: var(--text); }
  #status { margin-left: auto; color: var(--muted); }
  #status.live::before { content: "● "; color: #6abf69; }
  #status.down::before { content: "● "; color: #d9534f; }
  #flash { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #1b1d21; font-weight: 600; padding: 8px 16px;
    border-radius: 8px; opacity: 0; transition: opacity .3s; }
  #flash.show { opacity: 1; }
  #login { position: fixed; inset: 0; display: none; place-items: center; }
  #login form { display: grid; gap: 8px; width: min(360px, calc(100% - 32px)); }
  #empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
  #lights { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 4px; padding: 4px;
    flex-wrap: wrap; max-width: calc(100% - 24px); }
  #lights button { background: transparent; border-color: transparent; color: var(--muted); }
  #lights button:hover { color: var(--text); }
  #gridBtn { margin-left: 8px; }
  #dims { position: fixed; right: 12px; bottom: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { #dims { bottom: 64px; } }
  #lights button[aria-pressed="true"] { background: #3d424a; color: var(--text); border-color: #555b63; }
  #lights span { align-self: center; padding: 0 6px 0 4px; color: var(--muted); }
  #printers { color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pitem.busy::before { content: "● "; color: var(--accent); }
  .pitem.idle::before { content: "● "; color: #6abf69; }
  .pitem.err::before { content: "● "; color: #d9534f; }
  #printBtn { background: var(--accent); color: #1b1d21; border-color: var(--accent); font-weight: 600; }
  #printBtn:disabled { background: #33373e; color: var(--muted); border-color: #444a52; cursor: not-allowed; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid #444a52; border-radius: 10px;
    padding: 20px; width: min(440px, calc(100% - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 16px; }
  dialog dt { color: var(--muted); }
  dialog dd { margin: 0; }
  #code { font: 600 24px/1 ui-monospace, Menlo, monospace; letter-spacing: 4px; color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  dialog label.check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog .go { background: var(--accent); color: #1b1d21; border-color: var(--accent); font-weight: 600; }
  dialog .go:disabled { opacity: .4; cursor: not-allowed; }
  #printErr { color: #ff8a80; margin: 8px 0 0; }
  .seg { display: inline-flex; gap: 4px; padding: 4px; }
  .seg button { background: transparent; border-color: transparent; color: var(--muted); padding: 4px 10px; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: #3d424a; color: var(--text); border-color: #555b63; }
  #player { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 24px); padding: 8px 14px; backdrop-filter: blur(10px);
    background: rgb(32 35 41 / .94); border: 1px solid #4c525c; box-shadow: 0 8px 28px rgb(0 0 0 / .45); }
  #player[hidden] { display: none; }
  #player button { padding: 5px 10px; font-size: 13px; background: transparent; border-color: transparent; color: var(--muted); }
  #player button:hover { color: var(--text); }
  #player button[aria-pressed="true"] { background: #3d424a; color: var(--text); border-color: #555b63; }
  #player button#playBtn { background: var(--accent); color: #1b1d21; border-color: var(--accent); font-weight: 600; padding: 5px 12px; }
  #player button#playBtn:hover { filter: brightness(1.08); color: #1b1d21; }
  #player button.rec-on { background: #b83227; color: #fff; border-color: #d9534f; }
  #scrub { width: 160px; accent-color: var(--accent); cursor: pointer; }
  #stepLabel { color: var(--text); font-size: 13px; min-width: 110px; max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sep { width: 1px; height: 18px; background: #444a52; }
  #partsPop { position: fixed; left: 50%; bottom: 124px; transform: translateX(-50%); z-index: 25;
    max-height: 220px; overflow: auto; min-width: 220px; display: grid; gap: 4px;
    background: rgb(38 41 47 / .96); border: 1px solid #444a52; }
  #partsPop[hidden] { display: none; }
  #partsPop label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  #partsPop label:hover { background: #33373e; }
  #revBar { position: fixed; left: 50%; top: 68px; transform: translateX(-50%); z-index: 25;
    display: flex; align-items: center; gap: 8px; width: min(620px, calc(100% - 24px));
    background: rgb(32 35 41 / .95); border: 1px solid #4c525c; box-shadow: 0 8px 28px rgb(0 0 0 / .45); }
  #revBar[hidden] { display: none; }
  #revInput { flex: 1; min-width: 160px; }
  #revMicBtn.listening { background: #b83227; color: #fff; border-color: #d9534f; }
  #revStatus { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #revStatus.live { color: #6abf69; }
  @media (max-width: 720px) { #player { bottom: 112px; } #partsPop { bottom: 176px; } }
</style>

<body>
<div id="view"></div>
<header>
  <select id="project" class="card" aria-label="Project"></select>
  <div id="info" class="card">—</div>
  <div id="modeBar" class="card seg" role="group" aria-label="View mode" hidden>
    <button type="button" data-mode="assembly" aria-pressed="true">Assembly</button>
    <button type="button" data-mode="plate" aria-pressed="false">Print Plate</button>
  </div>
  <button id="revToggleBtn" class="card" title="Request revision (V)" hidden>🎤 Revise</button>
  <button id="printBtn" class="card" hidden>Print…</button>
  <div id="printers" class="card" title="Printer status">Printers: —</div>
  <div id="status" class="card down">connecting</div>
</header>
<div id="empty">No preview model (model.glb) in this version.</div>
<div id="login"><form class="card">
  <label for="token">Hub token (owner token on LAN, or read-only web token remotely)</label>
  <input id="token" type="password" autocomplete="off" required>
  <button>Save</button>
</form></div>
<div id="flash"></div>
<div id="dims" class="card" hidden></div>
<div id="revBar" class="card" hidden>
  <button type="button" id="revMicBtn" title="Speak revision (browser dictation)">🎤</button>
  <input id="revInput" type="text" placeholder="Describe revision (Enter to send)…" autocomplete="off">
  <button type="button" id="revSendBtn">Send</button>
  <span id="revStatus"></span>
</div>
<div id="partsPop" class="card" hidden></div>
<div id="player" class="card" role="group" aria-label="Assembly player" hidden>
  <button type="button" id="playBtn" title="Play / Pause assembly (Space)">▶ Play</button>
  <button type="button" id="explodeBtn" title="Toggle Exploded / Assembled">Explode</button>
  <button type="button" id="loopBtn" aria-pressed="true" title="Loop playback">↻</button>
  <input type="range" id="scrub" min="0" max="1" step="0.002" value="1" aria-label="Assembly progress">
  <span id="stepLabel">Assembled</span>
  <span class="sep"></span>
  <button type="button" data-speed="0.25">0.25×</button>
  <button type="button" data-speed="0.5">0.5×</button>
  <button type="button" data-speed="1" aria-pressed="true">1×</button>
  <button type="button" data-speed="2">2×</button>
  <span class="sep"></span>
  <button type="button" id="xrayBtn" aria-pressed="false" title="X-Ray translucency (X)">X-Ray</button>
  <button type="button" id="partsBtn" aria-pressed="false" title="Toggle individual parts">Parts</button>
  <span class="sep"></span>
  <button type="button" id="recBtn" title="Record canvas video">● Rec</button>
  <button type="button" id="rec360Btn" title="Auto 360° orbit + assembly video">360° Clip</button>
</div>
<div id="lights" class="card" role="group" aria-label="Lighting (L to cycle)"><span>Light</span></div>
<dialog id="printDlg" aria-labelledby="printTitle">
  <form method="dialog">
    <h2 id="printTitle">Print</h2>
    <div id="printBody"></div>
    <p id="printErr" role="alert" hidden></p>
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="printGo" class="go" value="go" disabled>Start print</button>
    </div>
  </form>
</dialog>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};

let token = store.get("forgeToken");
let current = null;
let shown = null;
let canPrint = false;
let printerList = [];

// --- 3D scene ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.NeutralToneMapping;
$("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);
const camera = new THREE.PerspectiveCamera(40, 1, 0.0001, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const LIGHT_PRESETS = {
  studio: { label: "Studio", hemi: 0.6, key: [1.2, [1, 1.6, 1.2]], fill: [0.4, [-1.2, 0.6, 0.8]], rim: [0.4, [0, 0.8, -1.5]] },
  top:    { label: "Top",    hemi: 0.35, key: [1.4, [0.15, 1, 0.1]], fill: [0.2, [-1, 0.4, -0.6]], rim: [0, [0, 1, 0]] },
  side:   { label: "Side",   hemi: 0.12, key: [1.2, [1, 0.12, 0.25]], fill: [0.08, [-1, 0.2, 0]], rim: [0, [0, 1, 0]] },
  camera: { label: "Camera", hemi: 0.35, key: [1.2, "camera"], fill: [0.25, [-1, 1, -0.5]], rim: [0, [0, 1, 0]] },
  flat:   { label: "Flat",   hemi: 1.6, key: [0, [0, 1, 0]], fill: [0, [0, 1, 0]], rim: [0, [0, 1, 0]] },
};
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
const lights = { key: new THREE.DirectionalLight(0xffffff, 1), fill: new THREE.DirectionalLight(0xffffff, 1), rim: new THREE.DirectionalLight(0xffffff, 1) };
scene.add(hemi, ...Object.values(lights));
for (const l of Object.values(lights)) scene.add(l.target);
let preset = LIGHT_PRESETS[store.get("forgeLight")] ? store.get("forgeLight") : "studio";
let focus = { center: new THREE.Vector3(), radius: 1 };

function placeLights() {
  const p = LIGHT_PRESETS[preset];
  hemi.intensity = p.hemi;
  for (const name of ["key", "fill", "rim"]) {
    const [intensity, dir] = p[name];
    const l = lights[name];
    l.intensity = intensity;
    const d = dir === "camera"
      ? camera.position.clone().sub(focus.center).normalize()
      : new THREE.Vector3(...dir).normalize();
    l.position.copy(focus.center).addScaledVector(d, focus.radius * 4);
    l.target.position.copy(focus.center);
  }
}

function setPreset(name) {
  preset = name;
  store.set("forgeLight", name);
  for (const b of $("lights").querySelectorAll("button[data-preset]"))
    b.setAttribute("aria-pressed", String(b.dataset.preset === name));
  placeLights();
}

for (const [name, p] of Object.entries(LIGHT_PRESETS)) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.preset = name; b.textContent = p.label;
  b.addEventListener("click", () => setPreset(name));
  $("lights").appendChild(b);
}
{
  const b = document.createElement("button");
  b.type = "button"; b.id = "gridBtn"; b.textContent = "Grid";
  b.addEventListener("click", () => setGrid(!showGrid));
  $("lights").appendChild(b);
}
addEventListener("keydown", (e) => {
  if (e.target.closest("input, select, textarea")) return;
  if (e.key === " " && !$("player").hidden) { e.preventDefault(); togglePlay(); return; }
  if (e.key.toLowerCase() === "v" && !$("revToggleBtn").hidden) { toggleRevBar(true); return; }
  if (e.key.toLowerCase() === "x" && !$("player").hidden) { setXray(!xrayOn); flash(`X-Ray: ${xrayOn ? "on" : "off"}`); }
  if (e.key.toLowerCase() === "p" && !$("modeBar").hidden) { setViewMode(viewMode === "plate" ? "assembly" : "plate"); }
  if (e.key.toLowerCase() === "g") { setGrid(!showGrid); flash(`Grid: ${showGrid ? "on" : "off"}`); }
  if (e.key.toLowerCase() === "l") {
    const names = Object.keys(LIGHT_PRESETS);
    setPreset(names[(names.indexOf(preset) + 1) % names.length]);
    flash(`Light: ${LIGHT_PRESETS[preset].label}`);
  }
});
controls.addEventListener("change", () => { if (LIGHT_PRESETS[preset].key[1] === "camera") placeLights(); });
setPreset(preset);

let model = null;
const PLATE = 0.256;
const grid = new THREE.Group();
scene.add(grid);
let showGrid = store.get("forgeGrid") !== "0";
function setGrid(on) {
  showGrid = on;
  store.set("forgeGrid", on ? "1" : "0");
  grid.visible = on;
  $("dims").hidden = !on || !model;
  $("gridBtn").setAttribute("aria-pressed", String(on));
}
setGrid(showGrid);

const minorStep = (size) => [0.001, 0.002, 0.005, 0.01, 0.02].find((s) => s >= Math.max(size.x, size.y, size.z) / 10) ?? 0.05;

function buildGrid(box) {
  grid.clear();
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.001), y = box.min.y - radius * 0.002;
  const minor = minorStep(size), major = minor * 10, half = PLATE / 2;
  const near = Math.min(half, Math.max(radius * 3, major));
  const lines = (pts, color) => {
    const g = new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(...p)));
    grid.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color })));
  };
  const square = (step, extent, lift) => {
    const pts = [], n = Math.floor(extent / step + 1e-6);
    for (let i = -n; i <= n; i++) {
      const o = i * step;
      pts.push([c.x - extent, y + lift, c.z + o], [c.x + extent, y + lift, c.z + o],
               [c.x + o, y + lift, c.z - extent], [c.x + o, y + lift, c.z + extent]);
    }
    return pts;
  };
  lines(square(minor, near, 0), 0x2c2f34);
  lines(square(major, half, radius * 0.0005), 0x474b52);
  const k = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => [c.x + a * half, y + radius * 0.001, c.z + b * half]);
  lines([k[0], k[1], k[1], k[2], k[2], k[3], k[3], k[0]], 0x8a8f96);
  const a = radius * 1.4, o = [c.x, y + radius * 0.0015, c.z];
  lines([o, [o[0] + a, o[1], o[2]]], 0xd94c4c);
  lines([o, [o[0], o[1], o[2] - a]], 0x59bf66);
  lines([o, [o[0], o[1] + a, o[2]]], 0x598cf2);
  const mm = (m) => (Math.round(m * 10000) / 10).toFixed(1);
  $("dims").textContent = `${mm(size.x)} × ${mm(size.z)} × ${mm(size.y)} mm · grid ${mm(minor)} mm`;
  $("dims").hidden = !showGrid;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// --- Assembly animation, Print Plate transition, X-Ray & Video capture ---
const MM = 0.001, DEG = Math.PI / 180;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
let asmSpec = null;
let partBindings = []; // { step, node, basePos, baseQuat, mats, animated }
let viewMode = "assembly"; // "assembly" | "plate"
let plateBlend = 0;
let asmProgress = 1; // 0 = exploded, 1 = assembled
let playing = false;
let looping = true;
let playSpeed = 1;
let xrayOn = false;
let lastFrameMs = performance.now();
let recorder = null, recChunks = [], recOrbit360 = false, recStartAngle = 0, recStartDist = 0, recStartY = 0;

function findPartNode(root, name) {
  let exact = null, loose = null;
  const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const want = norm(name);
  root.traverse((o) => {
    if (o === root) return;
    if (!exact && o.name === name) exact = o;
    if (!loose && want && norm(o.name) === want) loose = o;
  });
  return exact || loose;
}

function bindAssembly(root, spec) {
  asmSpec = spec;
  partBindings = [];
  if (!root || !spec || !Array.isArray(spec.steps)) {
    $("modeBar").hidden = true;
    $("player").hidden = true;
    $("partsPop").hidden = true;
    return;
  }
  const sorted = [...spec.steps].sort((a, b) => (a.step ?? 1) - (b.step ?? 1));
  for (const step of sorted) {
    const node = findPartNode(root, step.part);
    if (!node) continue;
    const mats = [];
    node.traverse((c) => {
      if (c.isMesh && c.material) {
        const list = Array.isArray(c.material) ? c.material : [c.material];
        for (const m of list) mats.push({ m, opacity: m.opacity, transparent: m.transparent, depthWrite: m.depthWrite });
      }
    });
    const sl = step.slide_mm || [0, 0, 0];
    const rt = step.rotate_deg || [0, 0, 0];
    const animated = sl.some((v) => Math.abs(v) > 1e-4) || rt.some((v) => Math.abs(v) > 1e-4);
    partBindings.push({
      step, node, mats, animated,
      basePos: node.position.clone(),
      baseQuat: node.quaternion.clone(),
    });
  }
  const hasPlate = partBindings.some((b) => b.step.plate);
  const hasAnim = partBindings.some((b) => b.animated);
  $("modeBar").hidden = !hasPlate;
  $("player").hidden = partBindings.length === 0;
  for (const id of ["playBtn", "explodeBtn", "loopBtn", "scrub"]) $(id).hidden = !hasAnim;
  for (const b of $("player").querySelectorAll("button[data-speed]")) b.hidden = !hasAnim;
  $("partsPop").innerHTML = partBindings.map((b, idx) =>
    `<label><input type="checkbox" data-pidx="${idx}" checked> ${esc(b.step.label || b.step.part)}</label>`
  ).join("");
  for (const cb of $("partsPop").querySelectorAll("input[data-pidx]")) {
    cb.addEventListener("change", () => {
      const b = partBindings[Number(cb.dataset.pidx)];
      if (b) b.node.visible = cb.checked;
    });
  }
  viewMode = "assembly";
  plateBlend = 0;
  asmProgress = 1;
  playing = false;
  setXray(false);
  updateModeUI();
  updatePlayerUI();
  applyTransforms();
}

function setXray(on) {
  xrayOn = on;
  $("xrayBtn").setAttribute("aria-pressed", String(on));
  for (const b of partBindings) {
    for (const rec of b.mats) {
      rec.m.transparent = on ? true : rec.transparent;
      rec.m.opacity = on ? 0.28 : rec.opacity;
      rec.m.depthWrite = on ? false : rec.depthWrite;
      rec.m.needsUpdate = true;
    }
  }
}

function setViewMode(mode) {
  if (mode === "plate" && !partBindings.some((b) => b.step.plate)) return;
  viewMode = mode;
  if (mode === "plate") playing = false;
  updateModeUI();
  updatePlayerUI();
}

function updateModeUI() {
  for (const b of $("modeBar").querySelectorAll("button[data-mode]"))
    b.setAttribute("aria-pressed", String(b.dataset.mode === viewMode));
}

function updatePlayerUI() {
  $("playBtn").textContent = playing ? "⏸ Pause" : "▶ Play";
  $("explodeBtn").textContent = asmProgress < 0.5 ? "Assemble" : "Explode";
  $("loopBtn").setAttribute("aria-pressed", String(looping));
  $("scrub").value = String(asmProgress);
  if (viewMode === "plate") {
    $("stepLabel").textContent = "Print Plate (Z=0)";
    return;
  }
  const anims = partBindings.filter((b) => b.animated);
  if (!anims.length) { $("stepLabel").textContent = "Assembled"; return; }
  if (asmProgress >= 0.999) { $("stepLabel").textContent = "Assembled"; return; }
  if (asmProgress <= 0.001) { $("stepLabel").textContent = "Exploded"; return; }
  const idx = Math.min(anims.length - 1, Math.floor(asmProgress * anims.length));
  const cur = anims[idx].step;
  $("stepLabel").textContent = `${idx + 1}/${anims.length} · ${cur.label || cur.part}`;
}

function togglePlay() {
  if (viewMode === "plate") setViewMode("assembly");
  if (!playing && asmProgress >= 0.995) asmProgress = 0;
  playing = !playing;
  updatePlayerUI();
}

const _tmpV = new THREE.Vector3(), _tmpPivot = new THREE.Vector3(), _tmpSlide = new THREE.Vector3();
const _tmpEuler = new THREE.Euler(), _tmpQ = new THREE.Quaternion();
const _platePos = new THREE.Vector3(), _plateQ = new THREE.Quaternion(), _plateRotQ = new THREE.Quaternion();

function applyTransforms() {
  if (!partBindings.length) return;
  const anims = partBindings.filter((b) => b.animated);
  const animIndex = new Map(anims.map((b, i) => [b, i]));
  const pb = ease(plateBlend);

  for (const b of partBindings) {
    // 1. Compute assembly pose at asmProgress (0 = exploded, 1 = assembled)
    let e = 0;
    if (b.animated && anims.length) {
      const k = animIndex.get(b);
      const localT = Math.min(1, Math.max(0, (asmProgress - k / anims.length) * anims.length));
      e = 1 - ease(localT);
    }
    const sl = b.step.slide_mm || [0, 0, 0];
    const rt = b.step.rotate_deg || [0, 0, 0];
    const pv = b.step.pivot_mm || [0, 0, 0];
    _tmpPivot.set(pv[0] * MM, pv[1] * MM, pv[2] * MM);
    _tmpSlide.set(sl[0] * MM * e, sl[1] * MM * e, sl[2] * MM * e);
    _tmpEuler.set(rt[0] * DEG * e, rt[1] * DEG * e, rt[2] * DEG * e, "XYZ");
    _tmpQ.setFromEuler(_tmpEuler);

    const asmPos = _tmpV.copy(b.basePos).sub(_tmpPivot).applyQuaternion(_tmpQ).add(_tmpPivot).add(_tmpSlide);
    const asmQuat = _tmpQ.clone().multiply(b.baseQuat);

    // 2. Blend toward Print Plate pose when plateBlend > 0
    if (pb > 0 && b.step.plate) {
      const pr = b.step.plate.rot_deg || [0, 0, 0];
      const pt = b.step.plate.translate_mm || [0, 0, 0];
      _plateRotQ.setFromEuler(_tmpEuler.set(pr[0] * DEG, pr[1] * DEG, pr[2] * DEG, "XYZ"));
      _plateQ.copy(_plateRotQ).multiply(b.baseQuat);
      _platePos.copy(b.basePos).applyQuaternion(_plateRotQ).add(_tmpSlide.set(pt[0] * MM, pt[1] * MM, pt[2] * MM));
      b.node.position.copy(asmPos).lerp(_platePos, pb);
      b.node.quaternion.copy(asmQuat).slerp(_plateQ, pb);
    } else {
      b.node.position.copy(asmPos);
      b.node.quaternion.copy(asmQuat);
    }
  }
}

function startRecording(orbit360) {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (typeof MediaRecorder === "undefined" || !renderer.domElement.captureStream) {
    flash("Video recording not supported in this browser");
    return;
  }
  const mimes = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = mimes.find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const stream = renderer.domElement.captureStream(60);
  recChunks = [];
  recorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 6_000_000 } : undefined);
  recOrbit360 = orbit360;
  if (orbit360) {
    setViewMode("assembly");
    asmProgress = 0;
    looping = false;
    playing = true;
    const dx = camera.position.x - focus.center.x, dz = camera.position.z - focus.center.z;
    recStartAngle = Math.atan2(dz, dx);
    recStartDist = Math.hypot(dx, dz);
    recStartY = camera.position.y;
    updatePlayerUI();
  }
  recorder.ondataavailable = (ev) => { if (ev.data.size) recChunks.push(ev.data); };
  recorder.onstop = () => {
    recOrbit360 = false;
    $("recBtn").classList.remove("rec-on");
    $("recBtn").textContent = "● Rec";
    $("rec360Btn").classList.remove("rec-on");
    const ext = (recorder.mimeType || "").includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(recChunks, { type: recorder.mimeType || "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `forge-${current || "model"}-v${shown || 0}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    flash(`Saved ${a.download}`);
  };
  recorder.start();
  (orbit360 ? $("rec360Btn") : $("recBtn")).classList.add("rec-on");
  if (!orbit360) $("recBtn").textContent = "■ Stop";
  flash(orbit360 ? "Recording 360° assembly clip…" : "Recording… (orbit freely, click Stop when done)");
}

for (const b of $("modeBar").querySelectorAll("button[data-mode]"))
  b.addEventListener("click", () => setViewMode(b.dataset.mode));
$("playBtn").addEventListener("click", togglePlay);
$("explodeBtn").addEventListener("click", () => {
  if (viewMode === "plate") setViewMode("assembly");
  playing = false;
  asmProgress = asmProgress < 0.5 ? 1 : 0;
  applyTransforms();
  updatePlayerUI();
});
$("loopBtn").addEventListener("click", () => { looping = !looping; updatePlayerUI(); });
$("scrub").addEventListener("input", (e) => {
  if (viewMode === "plate") setViewMode("assembly");
  playing = false;
  asmProgress = Number(e.target.value);
  applyTransforms();
  updatePlayerUI();
});
for (const b of $("player").querySelectorAll("button[data-speed]")) {
  b.addEventListener("click", () => {
    playSpeed = Number(b.dataset.speed);
    for (const o of $("player").querySelectorAll("button[data-speed]"))
      o.setAttribute("aria-pressed", String(o === b));
  });
}
$("xrayBtn").addEventListener("click", () => setXray(!xrayOn));
$("partsBtn").addEventListener("click", () => {
  const open = $("partsPop").hidden;
  $("partsPop").hidden = !open;
  $("partsBtn").setAttribute("aria-pressed", String(open));
});
$("recBtn").addEventListener("click", () => startRecording(false));
$("rec360Btn").addEventListener("click", () => startRecording(true));

renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - lastFrameMs) / 1000, 0.1);
  lastFrameMs = now;
  let dirty = false;
  const targetPlate = viewMode === "plate" ? 1 : 0;
  if (Math.abs(plateBlend - targetPlate) > 1e-4) {
    const dir = targetPlate > plateBlend ? 1 : -1;
    plateBlend = Math.min(1, Math.max(0, plateBlend + dir * dt / 0.55));
    dirty = true;
    if (model && (plateBlend === 0 || plateBlend === 1)) {
      applyTransforms();
      buildGrid(new THREE.Box3().setFromObject(model));
    }
  }
  if (playing && viewMode === "assembly" && partBindings.some((b) => b.animated)) {
    const duration = Math.max(2.4, partBindings.filter((b) => b.animated).length * 1.4);
    asmProgress += (dt * playSpeed) / duration;
    if (asmProgress >= 1) {
      if (recOrbit360 && recorder && recorder.state === "recording") {
        asmProgress = 1;
        playing = false;
        recorder.stop();
      } else if (looping) {
        asmProgress = 0;
      } else {
        asmProgress = 1;
        playing = false;
      }
    }
    if (recOrbit360) {
      const ang = recStartAngle + asmProgress * Math.PI * 2;
      camera.position.set(focus.center.x + Math.cos(ang) * recStartDist, recStartY, focus.center.z + Math.sin(ang) * recStartDist);
      camera.lookAt(focus.center);
      if (LIGHT_PRESETS[preset].key[1] === "camera") placeLights();
    }
    dirty = true;
    updatePlayerUI();
  }
  if (dirty) applyTransforms();
  controls.update();
  renderer.render(scene, camera);
});

function frame(obj, keepView) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.001);
  buildGrid(box);
  focus = { center, radius };
  placeLights();
  if (keepView) return;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(1, 0.8, 1.2).normalize().multiplyScalar(radius * 3));
  camera.near = radius / 100; camera.far = Math.max(radius * 100, PLATE * 10);
  camera.updateProjectionMatrix();
  placeLights();
}

// --- API ---
async function api(path, asBlob) {
  const r = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
  if (r.status === 401) { askToken(); throw new Error("token"); }
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return asBlob ? r.blob() : r.json();
}

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { Authorization: `Bearer ${token}`,
    "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, data };
}

function askToken() {
  store.del("forgeToken"); token = null;
  $("login").style.display = "grid";
}
$("login").querySelector("form").addEventListener("submit", (e) => {
  e.preventDefault();
  token = $("token").value.trim();
  store.set("forgeToken", token);
  $("login").style.display = "none";
  start();
});

function flash(text) {
  $("flash").textContent = text;
  $("flash").classList.add("show");
  setTimeout(() => $("flash").classList.remove("show"), 2500);
}

async function loadProjects() {
  const projects = await api("/projects");
  const sel = $("project");
  const wanted = current || decodeURIComponent(location.hash.slice(1)) || store.get("forgeProject");
  sel.innerHTML = "";
  for (const p of projects) sel.add(new Option(`${p.name} (v${p.latest})`, p.name));
  if (!projects.length) { $("info").textContent = "No projects yet — run `forge push`"; return; }
  sel.value = projects.some((p) => p.name === wanted) ? wanted : projects[0].name;
  current = sel.value;
}

async function loadReportBadge(proj, ver) {
  const rep = await call("GET", `/projects/${proj}/versions/${ver}/report`);
  if (proj !== current || ver !== shown) return;
  if (rep.ok && Array.isArray(rep.data.assumptions) && rep.data.assumptions.length && $("info").dataset.base) {
    $("info").innerHTML = $("info").dataset.base + ` · <span>${rep.data.assumptions.length} assumption(s)</span>`;
  }
}

async function show(keepView) {
  if (!current) return;
  const meta = await api(`/projects/${current}/versions/latest`);
  const time = new Date(meta.created_at).toLocaleString();
  const base = `<b>v${meta.version}</b> · ${esc(time)}${meta.note ? " · " + esc(meta.note) : ""}`;
  $("info").dataset.base = base;
  $("info").innerHTML = base;
  location.hash = current;
  store.set("forgeProject", current);
  const hasGlb = meta.files.some((f) => f.name === "model.glb");
  $("printBtn").hidden = !canPrint || !printerList.length || !meta.files.some((f) => f.name.endsWith(".gcode.3mf"));
  updatePrintButton();
  $("empty").style.display = hasGlb ? "none" : "grid";
  if (model) { scene.remove(model); model = null; }
  shown = meta.version;
  loadReportBadge(current, meta.version);
  refreshRevisionsUI();
  if (!hasGlb) { bindAssembly(null, null); return; }
  const blob = await api(`/projects/${current}/versions/${meta.version}/files/model.glb`, true);
  const url = URL.createObjectURL(blob);
  const gltf = await new GLTFLoader().loadAsync(url);
  URL.revokeObjectURL(url);
  model = gltf.scene;
  model.traverse((o) => { if (o.material) { o.material.metalness = 0; o.material.roughness = 0.6; } });
  scene.add(model);
  let spec = null;
  if (meta.files.some((f) => f.name === "assembly.json")) {
    try { spec = await api(`/projects/${current}/versions/${meta.version}/files/assembly.json`); }
    catch (e) { console.warn("assembly.json", e); }
  }
  bindAssembly(model, spec);
  frame(model, keepView);
}

$("project").addEventListener("change", (e) => { current = e.target.value; show(false); });

// --- Live SSE ---
async function listen() {
  for (let delay = 1000; ; delay = Math.min(delay * 2, 30000)) {
    try {
      const r = await fetch("/events", { headers: { Authorization: `Bearer ${token}` } });
      if (r.status === 401) { askToken(); return; }
      if (!r.ok) throw new Error(r.status);
      $("status").className = "card live"; $("status").textContent = "live";
      delay = 1000;
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const line = chunk.split("\n").find((l) => l.startsWith("data: "));
          if (line) onEvent(JSON.parse(line.slice(6)));
        }
      }
    } catch (e) { console.warn("SSE", e); }
    $("status").className = "card down"; $("status").textContent = "disconnected, retrying";
    await new Promise((res) => setTimeout(res, delay));
  }
}

async function onEvent(ev) {
  if (ev.type === "print") {
    flash(`Dispatched ${ev.project} v${ev.version} (${ev.printer_id || "printer"})`);
    pollPrinters(true);
    return;
  }
  if (ev.type === "revision" || ev.type === "revision_status" || ev.type === "session") {
    if (!ev.project || ev.project === current || ev.revision?.project === current) refreshRevisionsUI();
    if (ev.type === "revision_status" && ev.revision?.project === current) {
      flash(`Revision ${ev.revision.status}${ev.revision.result_version ? " → v" + ev.revision.result_version : ""}`);
    }
    return;
  }
  if (ev.type !== "version") return;
  await loadProjects();
  if (ev.project === current && ev.version !== shown) {
    await show(true);
    flash(`${ev.project} v${ev.version} arrived`);
  }
}

// --- LAN Revision bar (type or browser voice dictation) ---
let speechRec = null;
function toggleRevBar(forceOpen) {
  const open = forceOpen === true ? true : $("revBar").hidden;
  $("revBar").hidden = !open;
  if (open) { $("revInput").focus(); refreshRevisionsUI(); }
}

async function refreshRevisionsUI() {
  if (!canPrint || !current) return;
  const r = await call("GET", `/projects/${current}/revisions`);
  if (!r.ok) return;
  const st = $("revStatus");
  const latest = r.data.revisions?.[0];
  if (latest && (latest.status === "queued" || latest.status === "running")) {
    st.className = "live";
    st.textContent = `${latest.status}: ${latest.prompt.slice(0, 28)}`;
  } else if (r.data.session_connected) {
    st.className = "live";
    st.textContent = "● Chat listening";
  } else {
    st.className = "";
    st.textContent = "Queues on Hub";
  }
}

async function submitWebRevision() {
  const prompt = $("revInput").value.trim();
  if (!prompt || !current) return;
  $("revSendBtn").disabled = true;
  const r = await call("POST", `/projects/${current}/revisions`, { prompt, version: shown, source: "web" });
  $("revSendBtn").disabled = false;
  if (r.ok) {
    $("revInput").value = "";
    flash(r.data.session_connected ? "Revision sent to active chat!" : "Revision queued on Hub");
    refreshRevisionsUI();
  } else {
    flash(r.data.detail || `Revision error (${r.status})`);
  }
}

$("revToggleBtn").addEventListener("click", () => toggleRevBar());
$("revSendBtn").addEventListener("click", submitWebRevision);
$("revInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitWebRevision(); }
  if (e.key === "Escape") $("revBar").hidden = true;
});
$("revMicBtn").addEventListener("click", () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { flash("Voice dictation requires Chrome/Safari/Edge"); return; }
  if (speechRec) { speechRec.stop(); return; }
  speechRec = new SR();
  speechRec.lang = navigator.language || "en-US";
  speechRec.interimResults = true;
  speechRec.maxAlternatives = 1;
  $("revMicBtn").classList.add("listening");
  speechRec.onresult = (ev) => {
    const text = [...ev.results].map((r) => r[0].transcript).join("");
    $("revInput").value = text;
    if (ev.results[ev.results.length - 1].isFinal) submitWebRevision();
  };
  speechRec.onerror = () => { $("revMicBtn").classList.remove("listening"); speechRec = null; };
  speechRec.onend = () => { $("revMicBtn").classList.remove("listening"); speechRec = null; };
  speechRec.start();
});

// --- Multi-printer status & Print dialog ---
const dlg = $("printDlg");
let lastPrintInfo = null;
function printError(text) { $("printErr").textContent = text; $("printErr").hidden = !text; }
const isIdle = (p) => !p.error && ["IDLE", "FINISH", "FAILED"].includes(p.gcode_state);

function updatePrintButton() {
  const anyIdle = printerList.some(isIdle);
  const btn = $("printBtn");
  btn.disabled = !anyIdle;
  btn.title = anyIdle ? "Print this version" : "No idle printer available";
  const pre = [...$("printBody").querySelectorAll(".pre")];
  const sel = $("targetPrinter");
  const chosen = sel ? printerList.find((p) => p.id === sel.value) : printerList[0];
  const chosenOk = chosen && isIdle(chosen) && (!lastPrintInfo || (
    (!lastPrintInfo.printer_model || chosen.model === lastPrintInfo.printer_model) &&
    (!lastPrintInfo.nozzle || chosen.nozzle === lastPrintInfo.nozzle)
  ));
  $("printGo").disabled = !chosenOk || !pre.length || !pre.every((x) => x.checked);
}

$("printBtn").addEventListener("click", async () => {
  const ver = shown, proj = current;
  $("printTitle").textContent = `Print: ${proj} v${ver}`;
  $("printGo").disabled = true; $("printGo").hidden = false; printError("");
  $("printBody").innerHTML = "<p class='hint'>Loading print summary…</p>";
  dlg.dataset.target = JSON.stringify([proj, ver]);
  dlg.showModal();
  const r = await call("GET", `/projects/${proj}/versions/${ver}/print`);
  if (!r.ok) { $("printGo").hidden = true; $("printBody").innerHTML = ""; printError(r.data.detail || `Error ${r.status}`); return; }
  const i = r.data;
  lastPrintInfo = i;
  const opts = printerList.map((p) => {
    const compat = (!i.printer_model || p.model === i.printer_model) && (!i.nozzle || p.nozzle === i.nozzle);
    const label = `${p.name} (${p.model} ${p.nozzle}mm)` + (!compat ? " — incompatible" : !isIdle(p) ? " — busy" : "");
    return `<option value="${esc(p.id)}" ${!compat || !isIdle(p) ? "disabled" : ""}>${esc(label)}</option>`;
  }).join("");
  $("printBody").innerHTML = `
    <dl>
      <dt>Duration</dt><dd>~${esc(i.minutes)} min</dd>
      <dt>Filament</dt><dd>${i.grams != null ? esc(i.grams) + " g" : "-"}</dd>
      <dt>Plate</dt><dd>${esc(i.bed_type || "-")}</dd>
      <dt>Sliced for</dt><dd>${esc(i.printer_model || "-")} (${esc(i.nozzle || "-")} mm)</dd>
      <dt>Target</dt><dd><select id="targetPrinter">${opts}</select></dd>
    </dl>
    <div>Print code: <span id="code">${esc(i.code)}</span></div>
    <p class="hint">Give this single-use code to your AI agent or press Start print below.</p>
    <label class="check"><input type="checkbox" class="pre"> Build plate is empty, clean, and matches the sliced plate</label>
    <label class="check"><input type="checkbox" class="pre"> Correct filament is loaded</label>`;
  for (const c of $("printBody").querySelectorAll(".pre, #targetPrinter")) c.addEventListener("change", updatePrintButton);
  updatePrintButton();
});

$("printGo").addEventListener("click", async (e) => {
  e.preventDefault();
  const [proj, ver] = JSON.parse(dlg.dataset.target);
  const pid = $("targetPrinter")?.value;
  $("printGo").disabled = true; $("printGo").textContent = "Sending…"; printError("");
  const r = await call("POST", `/projects/${proj}/versions/${ver}/print`, pid ? { printer_id: pid } : {});
  $("printGo").textContent = "Start print";
  if (r.ok) { dlg.close(); flash(`Started: ${proj} v${ver} on ${r.data.printer_id}`); pollPrinters(true); }
  else { printError(r.data.detail || `Error ${r.status}`); pollPrinters(true); }
});

let pollTimer = null;
async function pollPrinters(now) {
  clearTimeout(pollTimer);
  let anyBusy = false;
  if (!document.hidden || now) {
    try {
      printerList = await api("/printers");
      const el = $("printers");
      if (!printerList.length) {
        el.textContent = "Preview-only (no printers configured)";
      } else {
        el.innerHTML = printerList.map((p) => {
          if (p.error) return `<span class="pitem err" title="${esc(p.error)}">${esc(p.name)}: offline</span>`;
          const busy = ["RUNNING", "PREPARE", "PAUSE", "SLICING"].includes(p.gcode_state);
          if (busy) anyBusy = true;
          const cls = busy ? "busy" : "idle";
          const txt = busy
            ? `${p.name}: ${p.gcode_state} ${p.mc_percent ?? 0}% (${p.mc_remaining_time ?? "?"}m)`
            : `${p.name}: ${p.gcode_state || "idle"}`;
          return `<span class="pitem ${cls}">${esc(txt)}</span>`;
        }).join("");
      }
    } catch (e) { console.warn(e); }
    updatePrintButton();
  }
  pollTimer = setTimeout(pollPrinters, anyBusy ? 10000 : 30000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollPrinters(true); });

async function start() {
  try {
    const me = await api("/me");
    canPrint = me.can_print;
    $("revToggleBtn").hidden = !canPrint || me.remote;
    if (me.remote) flash("Remote: read-only preview");
  } catch (e) { console.warn(e); }
  await pollPrinters(true);
  try { await loadProjects(); await show(false); } catch (e) { console.warn(e); }
  listen();
}

if (token) start(); else askToken();
