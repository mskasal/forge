[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-cad"
version = "0.2.0"
description = "Low-token parametric 3D CAD, printability validation, local/LAN 3D preview hub, and guarded printer dispatch for AI coding agents."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.13.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
hub = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "paho-mqtt>=2.1.0",
]
appletv = [
    "usd-core>=24.11",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forge.styles" = ["*.md", "fonts/*.ttf", "fonts/*.txt"]
